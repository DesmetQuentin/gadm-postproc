[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "GADMPostProc"
version = "0.1.0"
description = "Build xarray country/region masks from GADM 4.1 shapefiles"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Quentin Desmet", email = "quentin.desmet@univ-tlse3.fr" },
]
dependencies = [
    "xarray",
    "geopandas",
    "regionmask",
]

[tool.setuptools]
packages = ["GADMPostProc"]
